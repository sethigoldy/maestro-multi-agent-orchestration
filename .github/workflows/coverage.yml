name: coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -e . pytest coverage

      - name: Run tests with line and branch coverage
        run: python -m coverage run --branch -m pytest -q

      - name: Enforce 100% coverage
        run: python -m coverage report --fail-under=100

      - name: Generate coverage reports
        if: always()
        run: |
          python -m coverage xml
          python -m coverage html

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
