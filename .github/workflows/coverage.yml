name: coverage

on:
  push:
  pull_request:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest coverage
      - name: Full coverage test suite
        run: python -m coverage run --branch -m pytest -q
      - name: Enforce 100% coverage
        run: python -m coverage report --fail-under=100
      - name: Export coverage
        if: always()
        run: python -m coverage xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
