name: release

# Publishing a git tag like v0.9.0 runs the full gate and publishes the
# wheel + sdist as a GitHub Release with attached artifacts.
#
# IMPORTANT: this project is NOT published to PyPI — the package name
# `maestro` is already taken by an unrelated project (see README). Distribution
# is via GitHub Releases only; nothing here talks to PyPI.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project + test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest coverage build
      - name: Full test suite (with branch coverage)
        run: python -m coverage run --branch -m pytest -q
      - name: Enforce 100% branch coverage
        run: python -m coverage report --fail-under=100

      - name: Verify tag version == pyproject version == maestro.VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${TAG#v}"
          pyproject_version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          code_version=$(python -c 'from maestro import VERSION; print(VERSION)')
          echo "tag=$TAG expected=$expected pyproject=$pyproject_version code=$code_version"
          if [ "$expected" != "$pyproject_version" ]; then
            echo "::error::tag $TAG does not match pyproject version $pyproject_version"
            exit 1
          fi
          if [ "$expected" != "$code_version" ]; then
            echo "::error::tag $TAG does not match maestro.VERSION $code_version"
            exit 1
          fi

      - name: Build wheel + sdist
        run: python -m build
      - name: Validate artifacts (clean installs, fresh venvs)
        run: DIST_DIR=dist scripts/validate-package.sh
      - name: Hermetic fake-agent smoke test
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e .
          scripts/smoke-fake-agent.sh

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          # Notes via a file: keeps every line of this YAML block indented.
          {
            echo "Maestro ${version} — durable execution for coding agents."
            echo ""
            echo 'Install (the name "maestro" is taken on PyPI by an unrelated project, so this package is distributed here, not from PyPI):'
            echo ""
            echo '```bash'
            echo "pip install maestro-${version}-py3-none-any.whl   # attached below"
            echo "maestro --version   # ${version}"
            echo "maestro doctor"
            echo '```'
            echo ""
            echo "See the README for the quickstart."
          } > release-notes.md
          # Re-runnable: replace a pre-existing release for the same tag.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes
          fi
          gh release create "$tag" \
            dist/*.whl dist/*.tar.gz \
            --title "Maestro ${version}" \
            --notes-file release-notes.md \
            --latest
