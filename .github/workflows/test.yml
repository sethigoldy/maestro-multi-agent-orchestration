name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project + test dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -e . pytest pytest-xdist pytest-cov coverage build
      # The tests run in parallel, one worker per CPU (pytest-xdist). Branch
      # coverage and the 100% gate run on one Python version; measuring it
      # slows every test, and the other versions only need the tests to pass.
      - name: Full test suite with the 100% branch coverage gate
        if: matrix.python-version == '3.12'
        run: python -m pytest -n auto -q --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=100
      - name: Full test suite
        if: matrix.python-version != '3.12'
        run: python -m pytest -n auto -q
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install build tooling
        run: |
          python -m pip install -U pip
          python -m pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Validate clean installs (wheel and sdist, fresh venvs)
        run: DIST_DIR=dist scripts/validate-package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project (editable, for the smoke script's .venv convention)
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -U pip
          .venv/bin/python -m pip install -e .
      - name: Hermetic fake-agent smoke test (no real agent CLIs, no network)
        run: scripts/smoke-fake-agent.sh

  web-build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rebuild the console bundle (pinned esbuild via package-lock.json)
        working-directory: web
        run: npm ci && node build.mjs
      - name: Fail if checked-in maestro/web_dist/ is stale
        run: git diff --exit-code -- maestro/web_dist/
