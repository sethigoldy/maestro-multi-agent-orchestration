[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.5.8"
description = "Claude-supervised multi-agent orchestration with Codex implementation and local filesystem state"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0"]

[project.optional-dependencies]
memvara = ["memvara"]

[project.scripts]
maestro = "maestro.cli:main"
maestro-mcp = "maestro.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["maestro"]

[tool.setuptools.package-data]
"maestro" = ["../.claude/skills/maestro/SKILL.md"]
