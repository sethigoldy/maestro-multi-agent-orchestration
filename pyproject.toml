[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.8.4"
description = "Claude-supervised multi-agent orchestration with user-level task state"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0,<2"]

[project.optional-dependencies]
memvara = ["memvara"]


[project.scripts]
maestro = "maestro.cli:main"
maestro-mcp = "maestro.mcp_server:main"
maestro-daemon = "maestro.daemon_main:main"

[tool.setuptools.packages.find]
include = ["maestro*"]

[tool.coverage.run]
source = ["maestro"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
